# RF-DETR Nano fast airborne detection config.
# Usage: rfdetr fit --config configs/rfdetr_nano_airborne_fast.yaml

model:
  model_config:
    class_path: rfdetr.config.RFDETRNanoConfig
    init_args:
      num_classes: 6
      resolution: 640

  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_dir: ../airborne-object-tracking/exports/rf_detr_coco/
      output_dir: output/rfdetr_nano_airborne_fast

      epochs: 25
      batch_size: 32
      grad_accum_steps: 1
      num_workers: 8

      augmentation_backend: cpu
      square_resize_div_64: false
      pre_resize_aug_config:
        - TiledCroppingWithMasks:
            height: 640
            width: 640
            p: 0.8
      aug_config:
        - CopyPaste:
            p: 0.3
            max_paste_objects: 3
            max_iou: 0.3
        - HorizontalFlip:
            p: 0.5
      eval_pre_resize_aug_config:
        - TiledCroppingWithMasks:
            height: 640
            width: 640
            p: 1.0

      multi_scale: true
      do_random_resize_via_padding: false

      tensorboard: false
      wandb: false
      mlflow: true
      mlflow_log_artifacts: true
      mlflow_log_system_metrics: true
      train_log_on_step: true
      save_dataset_grids: true

trainer:
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
