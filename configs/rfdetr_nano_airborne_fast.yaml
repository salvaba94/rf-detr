# RF-DETR Nano fast airborne detection config.
# Usage: rfdetr fit --config configs/rfdetr_nano_airborne_fast.yaml

model:
  model_config:
    class_path: rfdetr.config.RFDETRNanoConfig
    init_args:
      num_classes: 6
      num_windows: 4
      resolution: 640
      positional_encoding_size: 40
      num_queries: 100
      num_select: 100

  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_dir: ../airborne-object-tracking/exports/rf_detr_coco/
      output_dir: output/rfdetr_nano_airborne_fast

      epochs: 10
      batch_size: 32
      grad_accum_steps: 1
      num_workers: 8
      progress_bar: rich

      augmentation_backend: cpu
      aug_config:
        - TiledCroppingWithMasks:
            height: 640
            width: 640
            p: 0.8
        - CopyPaste:
            p: 0.3
            max_paste_objects: 3
            max_iou: 0.3
        - HorizontalFlip:
            p: 0.5
        - Resize:
            height: 640
            width: 640
            p: 1.0

      multi_scale: true
      expanded_scales: true
      do_random_resize_via_padding: false

      tensorboard: false
      wandb: false
      mlflow: true
      save_dataset_grids: true

trainer:
  accelerator: auto
  devices: auto
