# RF-DETR Nano fast airborne detection config.
# Usage: rfdetr fit --config configs/rfdetr_nano_airborne_fast.yaml

model:
  model_config:
    class_path: rfdetr.config.RFDETRNanoConfig
    init_args:
      num_classes: 6
      amp: true
      resolution: 640

  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_dir: ../airborne-object-tracking/exports/rf_detr_coco/
      output_dir: output/rfdetr_nano_airborne_fast

      epochs: 25
      batch_size: 32
      validation_batch_size: 1
      grad_accum_steps: 1
      num_workers: 8
      progress_bar: rich

      augmentation_backend: cpu
      square_resize_div_64: false
      pre_resize_aug_config:
        - TiledCroppingWithMasks:
            height: 640
            width: 640
            p: 0.8
      aug_config:
        - CopyPaste:
            p: 0.3
            max_paste_objects: 3
            max_iou: 0.3
        - HorizontalFlip:
            p: 0.5
      multi_scale: true
      do_random_resize_via_padding: false

      tensorboard: false
      wandb: false
      mlflow:
        enabled: true
        log_artifacts: true
        log_system_metrics: true
      train_log_on_step: true
      validate_before_fit: true
      validation_mode: sahi
      sahi:
        slice_height: 640
        slice_width: 640
        overlap_height_ratio: 0.2
        overlap_width_ratio: 0.2
        nms_iou_threshold: 0.5
        confidence_threshold: 0.001
      save_dataset_grids: true
      prediction_grid_score_threshold: 0.5
      prediction_grid_max_predictions: 50

trainer:
  accelerator: auto
  devices: auto
  num_sanity_val_steps: 0
  log_every_n_steps: 10
